<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPIC 약학정보원 의약품 검색</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', sans-serif; background: #f5f7fa; color: #333; }
  header { background: #1a4f8a; color: white; padding: 20px 30px; }
  header h1 { font-size: 22px; }
  header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .search-bar { background: white; padding: 20px 30px; border-bottom: 1px solid #e0e0e0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .search-bar input { flex: 1; min-width: 250px; padding: 10px 16px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
  .search-bar input:focus { border-color: #1a4f8a; }
  .search-bar select { padding: 10px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; background: white; }
  .search-bar button { padding: 10px 24px; background: #1a4f8a; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .search-bar button:hover { background: #153d6e; }
  .status { padding: 10px 30px; font-size: 13px; color: #666; background: #f0f4ff; border-bottom: 1px solid #e0e0e0; }
  .results { padding: 20px 30px; }
  .drug-card { background: white; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; gap: 16px; align-items: flex-start; cursor: pointer; transition: box-shadow 0.2s; }
  .drug-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.15); }
  .drug-img { width: 60px; height: 60px; object-fit: contain; border-radius: 6px; border: 1px solid #eee; background: #fafafa; flex-shrink: 0; }
  .drug-img-placeholder { width: 60px; height: 60px; background: #e8f0fe; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .drug-info { flex: 1; }
  .drug-name { font-size: 16px; font-weight: 700; color: #1a4f8a; }
  .drug-enm { font-size: 12px; color: #888; margin-top: 2px; }
  .drug-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { padding: 3px 10px; border-radius: 20px; font-size: 12px; background: #e8f0fe; color: #1a4f8a; }
  .tag.noins { background: #fff3e0; color: #e65100; }
  .tag.narc { background: #fce4ec; color: #c62828; }
  .tag.permit { background: #e8f5e9; color: #2e7d32; }
  .detail { display: none; padding: 12px 16px; background: #f8f9ff; border-radius: 8px; margin-top: 10px; font-size: 13px; line-height: 1.7; }
  .detail .label { font-weight: 700; color: #555; display: inline-block; width: 90px; }
  .pagination { text-align: center; padding: 20px; }
  .pagination button { margin: 0 4px; padding: 8px 14px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-size: 13px; }
  .pagination button.active { background: #1a4f8a; color: white; border-color: #1a4f8a; }
  .pagination button:hover:not(.active) { background: #f0f4ff; }
  .loading { text-align: center; padding: 60px; font-size: 18px; color: #888; }
</style>
</head>
<body>
<header>
  <h1>💊 KPIC 약학정보원 의약품 검색</h1>
  <p>헤인파트너스 | 약학정보원 전체 의약품 데이터베이스</p>
</header>
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="약품명, 성분명, 제조사 검색..." autofocus>
  <select id="filterNoins">
    <option value="">급여구분 전체</option>
    <option value="Y">비급여</option>
    <option value="N">급여</option>
  </select>
  <select id="filterNarc">
    <option value="">마약구분 전체</option>
    <option value="마약">마약</option>
    <option value="향정">향정신성</option>
    <option value="한외">한외마약</option>
  </select>
  <button onclick="doSearch()">검색</button>
</div>
<div class="status" id="status">데이터 로딩 중...</div>
<div class="results" id="results"><div class="loading">⏳ 데이터 로딩 중... (약 44MB)</div></div>
<div class="pagination" id="pagination"></div>

<script>
let allData = [];
let filtered = [];
let currentPage = 1;
const PAGE_SIZE = 20;

async function loadData() {
  try {
    const resp = await fetch('kpic_light.json');
    allData = await resp.json();
    document.getElementById('status').textContent = '전체 ' + allData.length.toLocaleString() + '개 의약품 로드 완료 | 검색어를 입력하세요';
    doSearch();
  } catch(e) {
    document.getElementById('status').textContent = '데이터 로드 실패: ' + e.message;
    document.getElementById('results').innerHTML = '<div class="loading">❌ kpic_light.json 파일이 같은 폴더에 있는지 확인하세요</div>';
  }
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const noins = document.getElementById('filterNoins').value;
  const narc = document.getElementById('filterNarc').value;
  
  filtered = allData.filter(d => {
    const matchQ = !q || 
      (d.drug_name && d.drug_name.toLowerCase().includes(q)) ||
      (d.drug_enm && d.drug_enm.toLowerCase().includes(q)) ||
      (d.upso_name && d.upso_name.toLowerCase().includes(q)) ||
      (d.drug_code && d.drug_code.toLowerCase().includes(q)) ||
      (d.atc_cd && d.atc_cd.toLowerCase().includes(q));
    const matchNoins = !noins || d.noins === noins;
    const matchNarc = !narc || (d.narcotic_kind_code && d.narcotic_kind_code.includes(narc));
    return matchQ && matchNoins && matchNarc;
  });
  
  currentPage = 1;
  document.getElementById('status').textContent = 
    (q || noins || narc ? '"' + [q,noins,narc].filter(Boolean).join(' / ') + '" 검색결과: ' : '전체 ') + 
    filtered.length.toLocaleString() + '개';
  render();
}

function render() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  
  if (page.length === 0) {
    document.getElementById('results').innerHTML = '<div class="loading">검색 결과가 없습니다</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  
  document.getElementById('results').innerHTML = page.map((d, i) => {
    const imgHtml = d.drug_pic 
      ? `<img class="drug-img" src="${d.drug_pic}" onerror="this.style.display='none'" alt="">`
      : `<div class="drug-img-placeholder">💊</div>`;
    const permitYear = d.item_permit_date ? d.item_permit_date.toString().substring(0,4) + '년 허가' : '';
    return `<div class="drug-card" onclick="toggleDetail(this)">
      ${imgHtml}
      <div class="drug-info">
        <div class="drug-name">${d.drug_name || '-'}</div>
        <div class="drug-enm">${d.drug_enm || ''}</div>
        <div class="drug-meta">
          ${d.upso_name ? `<span class="tag">${d.upso_name.split('|')[0].trim()}</span>` : ''}
          ${d.drug_form ? `<span class="tag">${d.drug_form}</span>` : ''}
          ${d.drug_cls ? `<span class="tag">${d.drug_cls}</span>` : ''}
          ${d.noins === 'Y' ? '<span class="tag noins">비급여</span>' : '<span class="tag permit">급여</span>'}
          ${d.narcotic_kind_code ? `<span class="tag narc">${d.narcotic_kind_code}</span>` : ''}
          ${permitYear ? `<span class="tag permit">${permitYear}</span>` : ''}
        </div>
        <div class="detail">
          <div><span class="label">약품코드</span>${d.drug_code || '-'}</div>
          <div><span class="label">영문명</span>${d.drug_enm || '-'}</div>
          <div><span class="label">ATC코드</span>${d.atc_cd || '-'}</div>
          <div><span class="label">KPIC ATC</span>${d.kpic_atc || '-'}</div>
          <div><span class="label">약품분류</span>${d.drug_cls || '-'}</div>
          <div><span class="label">제형</span>${d.drug_form || '-'}</div>
          <div><span class="label">허가일</span>${d.item_permit_date || '-'}</div>
          <div><span class="label">급여구분</span>${d.noins === 'Y' ? '비급여' : '급여'}</div>
          <div><span class="label">마약구분</span>${d.narcotic_kind_code || '-'}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  
  renderPagination();
}

function toggleDetail(el) {
  const detail = el.querySelector('.detail');
  detail.style.display = detail.style.display === 'block' ? 'none' : 'block';
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  const start = Math.max(1, currentPage - 4);
  const end = Math.min(total, currentPage + 4);
  let html = '';
  if (currentPage > 1) html += `<button onclick="goPage(${currentPage-1})">◀</button>`;
  if (start > 1) html += `<button onclick="goPage(1)">1</button><span>...</span>`;
  for (let i = start; i <= end; i++)
    html += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if (end < total) html += `<span>...</span><button onclick="goPage(${total})">${total}</button>`;
  if (currentPage < total) html += `<button onclick="goPage(${currentPage+1})">▶</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) { currentPage = p; render(); window.scrollTo(0,0); }

document.getElementById('searchInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

loadData();
</script>
</body>
</html>
