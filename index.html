<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KPIC 약학정보원 의약품 검색</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Malgun Gothic',sans-serif;background:#f5f7fa;color:#333}header{background:#1a4f8a;color:white;padding:20px 30px}header h1{font-size:22px}header p{font-size:13px;opacity:.8;margin-top:4px}.sb{background:white;padding:14px 30px;border-bottom:1px solid #e0e0e0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.08)}.sb input{flex:1;min-width:200px;padding:9px 14px;border:2px solid #ddd;border-radius:8px;font-size:15px;outline:none}.sb input:focus{border-color:#1a4f8a}.sb select{padding:9px 10px;border:2px solid #ddd;border-radius:8px;font-size:13px;background:white;outline:none}.sb button{padding:9px 20px;background:#1a4f8a;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer}.sb button:hover{background:#153d6e}.st{padding:8px 30px;font-size:13px;color:#555;background:#eef2ff;border-bottom:1px solid #dde3f5}.res{padding:16px 30px}.card{background:white;border-radius:10px;padding:14px 18px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:14px;cursor:pointer;transition:box-shadow .15s}.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.13)}.dimg{width:56px;height:56px;object-fit:contain;border-radius:6px;border:1px solid #eee;flex-shrink:0}.dph{width:56px;height:56px;background:#e8f0fe;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}.di{flex:1;min-width:0}.dn{font-size:15px;font-weight:700;color:#1a4f8a}.de{font-size:11px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{padding:2px 9px;border-radius:20px;font-size:11px;background:#e8f0fe;color:#1a4f8a}.red{background:#fce4ec!important;color:#c62828!important}.ora{background:#fff3e0!important;color:#e65100!important}.grn{background:#e8f5e9!important;color:#2e7d32!important}.dtl{display:none;padding:10px 14px;background:#f8f9ff;border-radius:8px;margin-top:8px;font-size:12px;line-height:1.9}.dtl b{display:inline-block;width:80px;color:#555}.pg{text-align:center;padding:16px;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}.pg button{padding:6px 11px;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;font-size:12px}.pg button.on{background:#1a4f8a;color:white;border-color:#1a4f8a}.ld{text-align:center;padding:50px;font-size:16px;color:#888}</style></head><body><header><h1>&#128138; KPIC &#50557;&#54617;&#51221;&#48372;&#50896; &#51032;&#50557;&#54408; &#44160;&#49353;</h1><p>&#54744;&#51064;&#54028;&#53944;&#45320;&#49828;(Hain Partners) | &#51204;&#52404; &#51032;&#50557;&#54408; 41,185&#44148;</p></header><div class="sb"><input type="text" id="q" placeholder="&#50557;&#54408;&#47749;, &#50689;&#47928;&#47749;, &#51228;&#51312;&#49324;, &#53076;&#46300; &#44160;&#49353;..." autofocus><select id="fn"><option value="">&#44553;&#50668; &#51204;&#52404;</option><option value="Y">&#48708;&#44553;&#50668;</option><option value="N">&#44553;&#50668;</option></select><select id="fk"><option value="">&#47560;&#50557; &#51204;&#52404;</option><option value="&#47560;&#50557;">&#47560;&#50557;</option><option value="&#54693;&#51221;">&#54693;&#51221;&#49888;&#49457;</option><option value="&#54620;&#50808;">&#54620;&#50808;&#47560;&#50557;</option></select><button onclick="go_search()">&#128269; &#44160;&#49353;</button></div><div class="st" id="st">&#9203; &#46370;&#51060;&#53552; &#47196;&#46377; &#51473;... (&#50557; 44MB)</div><div class="res" id="res"><div class="ld">&#9203; &#47196;&#46377; &#51473;...</div></div><div class="pg" id="pg"></div><script>let all=[],fil=[],pg=1;const PS=20;fetch('kpic_light.json').then(r=>r.json()).then(d=>{all=d;document.getElementById('st').textContent='&#10003; &#51204;&#52404; '+all.length.toLocaleString()+'&#44060; &#47196;&#46300; &#50756;&#47308; | &#44160;&#49353;&#50612;&#47484; &#51077;&#47141;&#54616;&#49464;&#50836;';go_search();}).catch(e=>{document.getElementById('st').textContent='&#10060; '+e.message;});function go_search(){const q=document.getElementById('q').value.trim().toLowerCase(),n=document.getElementById('fn').value,k=document.getElementById('fk').value;fil=all.filter(d=>{const mq=!q||(d.drug_name&&d.drug_name.toLowerCase().includes(q))||(d.drug_enm&&d.drug_enm.toLowerCase().includes(q))||(d.upso_name&&d.upso_name.toLowerCase().includes(q))||(d.drug_code&&d.drug_code.toLowerCase().includes(q))||(d.atc_cd&&d.atc_cd.toLowerCase().includes(q));return mq&&(!n||d.noins===n)&&(!k||(d.narcotic_kind_code&&d.narcotic_kind_code.includes(k)));});pg=1;document.getElementById('st').textContent=(q||n||k?'&#44160;&#49353;&#44208;&#44284;: ':'&#51204;&#52404; ')+fil.length.toLocaleString()+'&#44060;';render();}function render(){const s=(pg-1)*PS,it=fil.slice(s,s+PS);if(!it.length){document.getElementById('res').innerHTML='<div class="ld">&#44160;&#49353; &#44208;&#44284; &#50630;&#51020;</div>';document.getElementById('pg').innerHTML='';return;}document.getElementById('res').innerHTML=it.map(d=>{const im=d.drug_pic?'<img class="dimg" src="'+d.drug_pic+'" onerror="this.style.display='none'" alt="">'+'<div class="dph" style="display:none">&#128138;</div>':'<div class="dph">&#128138;</div>';const yr=d.item_permit_date?d.item_permit_date.toString().slice(0,4)+'&#45380;':'';return'<div class="card" onclick="tog(this)">'+im+'<div class="di"><div class="dn">'+(d.drug_name||'-')+'</div><div class="de">'+(d.drug_enm||'')+'</div><div class="tags">'+(d.upso_name?'<span class="tag">'+d.upso_name.split("|")[0].trim()+'</span>':'')+(d.drug_form?'<span class="tag">'+d.drug_form+'</span>':'')+(d.noins==='Y'?'<span class="tag ora">&#48708;&#44553;&#50668;</span>':'<span class="tag grn">&#44553;&#50668;</span>')+(d.narcotic_kind_code?'<span class="tag red">'+d.narcotic_kind_code+'</span>':'')+(yr?'<span class="tag grn">'+yr+'</span>':'')+'</div><div class="dtl"><div><b>&#50557;&#54408;&#53076;&#46300;</b>'+(d.drug_code||'-')+'</div><div><b>&#50689;&#47928;&#47749;</b>'+(d.drug_enm||'-')+'</div><div><b>ATC&#53076;&#46300;</b>'+(d.atc_cd||'-')+'</div><div><b>KPIC ATC</b>'+(d.kpic_atc||'-')+'</div><div><b>&#50557;&#54408;&#48516;&#47448;</b>'+(d.drug_cls||'-')+'</div><div><b>&#51228;&#54805;</b>'+(d.drug_form||'-')+'</div><div><b>&#54728;&#44032;&#51068;</b>'+(d.item_permit_date||'-')+'</div><div><b>&#44553;&#50668;&#44396;&#48516;</b>'+(d.noins==='Y'?'&#48708;&#44553;&#50668;':'&#44553;&#50668;')+'</div><div><b>&#47560;&#50557;&#44396;&#48516;</b>'+(d.narcotic_kind_code||'-')+'</div></div></div></div>';}).join('');rpg();}function tog(el){const d=el.querySelector('.dtl');d.style.display=d.style.display==='block'?'none':'block';}function rpg(){const tot=Math.ceil(fil.length/PS);if(tot<=1){document.getElementById('pg').innerHTML='';return;}const st=Math.max(1,pg-4),en=Math.min(tot,pg+4);let h='';if(pg>1)h+='<button onclick="gp('+(pg-1)+')">&#9664;</button>';if(st>1)h+='<button onclick="gp(1)">1</button><span>&#8230;</span>';for(let i=st;i<=en;i++)h+='<button class="'+(i===pg?'on':'')+'" onclick="gp('+i+')">'+i+'</button>';if(en<tot)h+='<span>&#8230;</span><button onclick="gp('+tot+')">'+tot+'</button>';if(pg<tot)h+='<button onclick="gp('+(pg+1)+')">&#9654;</button>';document.getElementById('pg').innerHTML=h;}function gp(p){pg=p;render();window.scrollTo(0,0);}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')go_search();});</script></body></html>
