<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KPIC 약학정보원 의약품 검색 | 헤인파트너스</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic',sans-serif;background:#f5f7fa;color:#333}
header{background:linear-gradient(135deg,#1a4f8a,#2a6fd4);color:white;padding:22px 30px}
header h1{font-size:22px;font-weight:700}
header p{font-size:13px;opacity:.8;margin-top:5px}
.sb{background:white;padding:14px 30px;border-bottom:1px solid #e0e0e0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sb input{flex:1;min-width:200px;padding:9px 14px;border:2px solid #ddd;border-radius:8px;font-size:15px;outline:none;transition:border .2s}
.sb input:focus{border-color:#1a4f8a}
.sb select{padding:9px 10px;border:2px solid #ddd;border-radius:8px;font-size:13px;background:white;outline:none;cursor:pointer}
.sb button{padding:9px 22px;background:#1a4f8a;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:background .2s}
.sb button:hover{background:#153d6e}
.st{padding:9px 30px;font-size:13px;color:#555;background:#eef2ff;border-bottom:1px solid #dde3f5}
.res{padding:16px 30px;max-width:1200px;margin:0 auto}
.card{background:white;border-radius:10px;padding:14px 18px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:14px;cursor:pointer;transition:box-shadow .15s,transform .1s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-1px)}
.dimg{width:56px;height:56px;object-fit:contain;border-radius:6px;border:1px solid #eee;flex-shrink:0}
.dph{width:56px;height:56px;background:#e8f0fe;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.di{flex:1;min-width:0}
.dn{font-size:15px;font-weight:700;color:#1a4f8a}
.de{font-size:11px;color:#aaa;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{padding:3px 10px;border-radius:20px;font-size:11px;background:#e8f0fe;color:#1a4f8a;font-weight:500}
.red{background:#fce4ec!important;color:#c62828!important}
.ora{background:#fff3e0!important;color:#e65100!important}
.grn{background:#e8f5e9!important;color:#2e7d32!important}
.gray{background:#f5f5f5!important;color:#666!important}
.dtl{display:none;padding:12px 14px;background:#f8f9ff;border-radius:8px;margin-top:10px;font-size:12px;line-height:2;border:1px solid #e8edff}
.dtl b{display:inline-block;width:85px;color:#555;font-weight:600}
.pg{text-align:center;padding:20px;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.pg button{padding:7px 12px;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;font-size:12px;transition:all .15s}
.pg button.on{background:#1a4f8a;color:white;border-color:#1a4f8a}
.pg button:hover:not(.on){background:#f0f4ff}
.ld{text-align:center;padding:60px;font-size:16px;color:#888}
.prog{text-align:center;padding:40px;color:#1a4f8a}
.prog .bar{width:300px;height:8px;background:#e0e0e0;border-radius:4px;margin:12px auto;overflow:hidden}
.prog .fill{height:100%;background:#1a4f8a;border-radius:4px;transition:width .3s}
</style>
</head>
<body>
<header>
  <h1>&#128138; KPIC 약학정보원 의약품 검색</h1>
  <p>헤인파트너스(Hain Partners) &nbsp;|&nbsp; 전체 의약품 41,185건 &nbsp;|&nbsp; 데이터 출처: 약학정보원(KPIC) 2026.06</p>
</header>
<div class="sb">
  <input type="text" id="q" placeholder="약품명, 영문명, 제조사, 코드, ATC코드 검색..." autofocus>
  <select id="fn">
    <option value="">급여 전체</option>
    <option value="N">급여</option>
    <option value="Y">비급여</option>
  </select>
  <select id="fk">
    <option value="">마약 전체</option>
    <option value="마약">마약</option>
    <option value="향정">향정신성</option>
    <option value="한외">한외마약</option>
  </select>
  <button onclick="go_search()">&#128269; 검색</button>
</div>
<div class="st" id="st">
  <div class="prog" id="prog">
    &#9203; 데이터 로딩 중... <span id="pct">0%</span>
    <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
  </div>
</div>
<div class="res" id="res"></div>
<div class="pg" id="pg"></div>

<script>
let all=[], fil=[], pg=1;
const PS=20;

async function loadAll(){
  const files=['data_1.json','data_2.json','data_3.json'];
  for(let i=0;i<files.length;i++){
    const r=await fetch(files[i]);
    const d=await r.json();
    all=all.concat(d);
    const pct=Math.round((i+1)/files.length*100);
    document.getElementById('pct').textContent=pct+'%';
    document.getElementById('fill').style.width=pct+'%';
  }
  document.getElementById('st').innerHTML='&#10003; 전체 <b>'+all.length.toLocaleString()+'</b>개 로드 완료 &nbsp;|&nbsp; 검색어를 입력하거나 필터를 선택하세요';
  go_search();
}

function go_search(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const n=document.getElementById('fn').value;
  const k=document.getElementById('fk').value;
  fil=all.filter(d=>{
    const mq=!q
      ||(d.drug_name&&d.drug_name.toLowerCase().includes(q))
      ||(d.drug_enm&&d.drug_enm.toLowerCase().includes(q))
      ||(d.upso_name&&d.upso_name.toLowerCase().includes(q))
      ||(d.drug_code&&d.drug_code.toLowerCase().includes(q))
      ||(d.atc_cd&&d.atc_cd.toLowerCase().includes(q))
      ||(d.kpic_atc&&d.kpic_atc.toLowerCase().includes(q));
    return mq&&(!n||d.noins===n)&&(!k||(d.narcotic_kind_code&&d.narcotic_kind_code.includes(k)));
  });
  pg=1;
  document.getElementById('st').innerHTML=(q||n||k?'검색결과: ':'전체 ')+'<b>'+fil.length.toLocaleString()+'</b>개';
  render();
}

function render(){
  const s=(pg-1)*PS, it=fil.slice(s,s+PS);
  if(!it.length){
    document.getElementById('res').innerHTML='<div class="ld">&#128540; 검색 결과가 없습니다</div>';
    document.getElementById('pg').innerHTML='';
    return;
  }
  document.getElementById('res').innerHTML=it.map(d=>{
    const img=d.drug_pic
      ?'<img class="dimg" src="'+d.drug_pic+'" onerror="this.parentNode.querySelector(\'.dph\').style.display=\'flex\';this.style.display=\'none\'" alt=""><div class="dph" style="display:none">&#128138;</div>'
      :'<div class="dph">&#128138;</div>';
    const yr=d.item_permit_date?d.item_permit_date.toString().slice(0,4)+'년':'';
    const upso=d.upso_name?d.upso_name.split('|')[0].trim():'';
    return '<div class="card" onclick="tog(this)">'+img
      +'<div class="di">'
      +'<div class="dn">'+(d.drug_name||'-')+'</div>'
      +'<div class="de">'+(d.drug_enm||'&nbsp;')+'</div>'
      +'<div class="tags">'
      +(upso?'<span class="tag gray">'+upso+'</span>':'')
      +(d.drug_form?'<span class="tag">'+d.drug_form+'</span>':'')
      +(d.drug_cls?'<span class="tag">'+d.drug_cls.slice(0,15)+'</span>':'')
      +(d.noins==='Y'?'<span class="tag ora">비급여</span>':'<span class="tag grn">급여</span>')
      +(d.narcotic_kind_code?'<span class="tag red">'+d.narcotic_kind_code+'</span>':'')
      +(yr?'<span class="tag grn">'+yr+'</span>':'')
      +'</div>'
      +'<div class="dtl">'
      +'<div><b>약품코드</b>'+(d.drug_code||'-')+'</div>'
      +'<div><b>영문명</b>'+(d.drug_enm||'-')+'</div>'
      +'<div><b>제조사</b>'+(upso||'-')+'</div>'
      +'<div><b>ATC 코드</b>'+(d.atc_cd||'-')+'</div>'
      +'<div><b>KPIC ATC</b>'+(d.kpic_atc||'-')+'</div>'
      +'<div><b>약품 분류</b>'+(d.drug_cls||'-')+'</div>'
      +'<div><b>제형</b>'+(d.drug_form||'-')+'</div>'
      +'<div><b>허가일</b>'+(d.item_permit_date||'-')+'</div>'
      +'<div><b>급여구분</b>'+(d.noins==='Y'?'비급여':'급여')+'</div>'
      +'<div><b>마약구분</b>'+(d.narcotic_kind_code||'해당없음')+'</div>'
      +'</div>'
      +'</div></div>';
  }).join('');
  rpg();
}

function tog(el){
  const d=el.querySelector('.dtl');
  d.style.display=d.style.display==='block'?'none':'block';
}

function rpg(){
  const tot=Math.ceil(fil.length/PS);
  if(tot<=1){document.getElementById('pg').innerHTML='';return;}
  const st=Math.max(1,pg-4),en=Math.min(tot,pg+4);
  let h='';
  if(pg>1)h+='<button onclick="gp('+(pg-1)+')">&#9664;</button>';
  if(st>1)h+='<button onclick="gp(1)">1</button><span style="padding:6px 4px;font-size:13px">&#8230;</span>';
  for(let i=st;i<=en;i++)h+='<button class="'+(i===pg?'on':'')+'" onclick="gp('+i+')">'+i+'</button>';
  if(en<tot)h+='<span style="padding:6px 4px;font-size:13px">&#8230;</span><button onclick="gp('+tot+')">'+tot+'</button>';
  if(pg<tot)h+='<button onclick="gp('+(pg+1)+')">&#9654;</button>';
  document.getElementById('pg').innerHTML=h;
}

function gp(p){pg=p;render();window.scrollTo(0,0);}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')go_search();});

loadAll();
</script>
</body>
</html>
